# Pings the hosted demo so Render's free tier does not spin down.
# Set the repository variable DEMO_URL to the service origin, with no path.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then
            echo "DEMO_URL repository variable is not set."
            echo "Settings → Secrets and variables → Actions → Variables → DEMO_URL = https://<service>.onrender.com"
            exit 1
          fi
          url="${DEMO_URL%/}/health"
          echo "GET $url"
          curl --fail --show-error --silent --max-time 90 "$url"
          echo
          echo "ok"
