name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The merchant problem
      description: Who loses money or time today, and when?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: The change keeps every PayPal write behind human approval.
          required: true
